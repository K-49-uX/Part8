on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Test library-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm ci
          cd tests-chapter4
          npm ci
      - name: Run tests
        run: |
          cd tests-chapter4
          npm test