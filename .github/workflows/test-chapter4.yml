on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Test library-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: tests-chapter4
        run: npm ci
      - name: Run tests
        working-directory: tests-chapter4
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_12345
        run: npm test